<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center text-primary mb-4">Bootstrap Components</h2>

    <!-- 1️ Alert -->
    <div class="alert alert-success text-center">
        This is a Success Alert!
    </div>

    <!-- 2 Grid System -->
    <div class="row text-center mb-4">
        <div class="col border -md-4 p-3">
            Column 1
        </div>
        <div class="col border -md-4 p-3">
            Column 2
        </div>
        <div class="col border -md-4 p-3">
            Column 3
        </div>
    </div>

    <!-- 3️ Buttons -->
    <div class="text-center mb-4">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-success">Success</button>
    </div>

    <!-- 4️ Card -->
    <div class="card mx-auto shadow" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">Employee Card</h5>
            <p class="card-text"><b>Name:</b> Jhon<b> Designation:</b> Manager</p>
            <a href="#" class="btn btn-dark">Access card</a>
        </div>
    </div>

</div>

</body>
</html>
