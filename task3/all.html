<!DOCTYPE html>
<html>
<head>
  <title>Services Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyBrand</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Cards -->
<div class="container mt-4">
  <div class="row">
    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/300" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Web Design</h5>
          <p class="card-text">We build websites.</p>
          <a href="#" class="btn btn-primary">More</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/600" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">App Development</h5>
          <p class="card-text">We build mobile apps.</p>
          <a href="#" class="btn btn-primary">More</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/100" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">SEO</h5>
          <p class="card-text">We improve ranking.</p>
          <a href="#" class="btn btn-primary">More</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Contact Form -->
<div class="container mt-5 mb-5">
  <h2>Contact Us</h2>
  <form>
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control"></textarea>
    </div>

    <button class="btn btn-success">Send Message</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
